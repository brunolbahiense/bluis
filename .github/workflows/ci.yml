name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      # yarn test roda os unitários pra falhar rápido; yarn build os roda de novo via
      # prebuild (scripts/build-info.mjs), que grava os números reais em build-info.json.
      - run: yarn build
      - run: yarn playwright install --with-deps chromium webkit firefox
      - run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
